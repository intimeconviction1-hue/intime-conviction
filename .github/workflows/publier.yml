# Construit le site et le publie sur GitHub Pages.
#
# Les articles vivent dans le dépôt PRIVÉ intime-conviction-articles. Ils sont
# lus ici avec une clé de déploiement en LECTURE SEULE (secret
# ARTICLES_DEPLOY_KEY) et ne sont jamais committés dans ce dépôt public : le
# site publié est un artefact Pages, conservé un jour, pas un historique git.
# Retirer un article = le supprimer du dépôt privé, puis relancer ce workflow.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lire les articles (dépôt privé)
        uses: actions/checkout@v7
        with:
          repository: intimeconviction1-hue/intime-conviction-articles
          ssh-key: ${{ secrets.ARTICLES_DEPLOY_KEY }}
          path: articles-prives

      - name: Identifier la version éditoriale publiée
        run: |
          printf '### Version du fonds éditorial\n\n`%s`\n' "$(git -C articles-prives rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Tester la collecte privée avant publication
        run: node --test articles-prives/outils/actualites.test.mjs

      - name: Auditer les archives sans les modifier
        continue-on-error: true
        run: npm run audit:archives
        env:
          IC_ARTICLES: articles-prives/articles
          IC_AUDIT_OUTPUT: audit-archives/rapport.json

      - name: Conserver le rapport d’audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-documentaire-archives
          path: audit-archives/
          if-no-files-found: warn
          retention-days: 30

      - name: Auditer la production éditoriale en interne
        continue-on-error: true
        run: node scripts/auditer-production.mjs
        env:
          IC_ARTICLES: articles-prives/articles
          IC_AUDIT_PRODUCTION_OUTPUT: audit-production/rapport.json

      - name: Afficher l’objectif rédactionnel du jour dans le bilan Actions
        run: node scripts/rapport-production-actions.mjs
        env:
          IC_AUDIT_PRODUCTION_OUTPUT: audit-production/rapport.json

      - name: Conserver le bilan interne agrégé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-production-editoriale
          path: audit-production/rapport.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retrouver le dernier relevé d’actualités
        uses: actions/cache@v6
        with:
          path: .cache/actualites.json
          key: actualites-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: actualites-v1-

      - name: Copier exclusivement les images attribuées aux articles publiés
        run: node scripts/preparer-illustrations.mjs
        env:
          IC_ARTICLES: articles-prives/articles

      - name: Construire
        run: npm run build
        env:
          IC_ARTICLES: articles-prives/articles
          IC_VEILLE: articles-prives/veille-alertes.json
          IC_VEILLE_AJOUTS: articles-prives/veille-alertes-ajouts.json

      - name: Auditer le maillage interne généré
        run: node scripts/auditer-maillage.mjs dist
        env:
          IC_AUDIT_MAILLAGE_OUTPUT: audit-maillage/rapport.json

      - name: Refuser les anomalies non justifiées
        run: node scripts/verifier-seuils-maillage.mjs audit-maillage/rapport.json

      - name: Installer Chromium pour les contrôles mobiles
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Démarrer l’aperçu local
        run: |
          nohup npx astro preview --host 127.0.0.1 > /tmp/astro-preview.log 2>&1 &
          for essai in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Vérifier CLS, LCP et navigation mobile
        run: node scripts/controle-stabilite-mobile.mjs
        env:
          IC_VISUAL_BASE_URL: http://127.0.0.1:4321

      - name: Conserver le rapport du contrôle mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-stabilite-mobile
          path: controle-stabilite-mobile/rapport.json
          if-no-files-found: warn
          retention-days: 30

      - name: Conserver le rapport du maillage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-maillage-interne
          path: audit-maillage/
          if-no-files-found: warn
          retention-days: 30

      - name: Contrôler le texte destiné au public
        run: node scripts/controle-publication.mjs dist

      - name: Bloquer les doublons entre le journal et la presse en accueil
        run: node scripts/controle-doublons-accueil.mjs dist
        env:
          IC_ARTICLES: articles-prives/articles

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          retention-days: 1

  publier:
    needs: construire
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
