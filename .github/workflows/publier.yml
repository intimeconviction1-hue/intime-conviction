# Construit le site et le publie sur GitHub Pages.
#
# Les articles vivent dans le dépôt PRIVÉ intime-conviction-articles. Ils sont
# lus ici avec une clé de déploiement en LECTURE SEULE (secret
# ARTICLES_DEPLOY_KEY) et ne sont jamais committés dans ce dépôt public : le
# site publié est un artefact Pages, conservé un jour, pas un historique git.
# Retirer un article = le supprimer du dépôt privé, puis relancer ce workflow.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lire les articles (dépôt privé)
        uses: actions/checkout@v7
        with:
          repository: intimeconviction1-hue/intime-conviction-articles
          ssh-key: ${{ secrets.ARTICLES_DEPLOY_KEY }}
          path: articles-prives

      - name: Identifier la version éditoriale publiée
        run: |
          printf '### Version du fonds éditorial\n\n`%s`\n' "$(git -C articles-prives rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Tester la collecte privée avant publication
        run: node --test articles-prives/outils/actualites.test.mjs

      - name: Auditer les archives sans les modifier
        continue-on-error: true
        run: npm run audit:archives
        env:
          IC_ARTICLES: articles-prives/articles
          IC_AUDIT_OUTPUT: audit-archives/rapport.json

      - name: Conserver le rapport d’audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-documentaire-archives
          path: audit-archives/
          if-no-files-found: warn
          retention-days: 30

      - name: Auditer la production éditoriale en interne
        continue-on-error: true
        run: node scripts/auditer-production.mjs
        env:
          IC_ARTICLES: articles-prives/articles
          IC_AUDIT_PRODUCTION_OUTPUT: audit-production/rapport.json

      - name: Afficher l’objectif rédactionnel du jour dans le bilan Actions
        run: node scripts/rapport-production-actions.mjs
        env:
          IC_AUDIT_PRODUCTION_OUTPUT: audit-production/rapport.json

      - name: Conserver le bilan interne agrégé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-production-editoriale
          path: audit-production/rapport.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retrouver le dernier relevé d’actualités
        uses: actions/cache@v6
        with:
          path: .cache/actualites.json
          key: actualites-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: actualites-v1-

      - name: Installer ImageMagick pour les photographies documentaires
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version
          identify -version

      - name: Copier exclusivement les images attribuées aux articles publiés
        run: node scripts/preparer-illustrations.mjs
        env:
          IC_ARTICLES: articles-prives/articles

      - name: Construire
        run: npm run build
        env:
          IC_ARTICLES: articles-prives/articles
          IC_VEILLE: articles-prives/veille-alertes.json
          IC_VEILLE_AJOUTS: articles-prives/veille-alertes-ajouts.json

      - name: Auditer le maillage interne généré
        run: node scripts/auditer-maillage.mjs dist
        env:
          IC_AUDIT_MAILLAGE_OUTPUT: audit-maillage/rapport.json

      - name: Refuser les anomalies non justifiées
        run: node scripts/verifier-seuils-maillage.mjs audit-maillage/rapport.json

      - name: Installer Chromium pour les contrôles mobiles
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Démarrer l’aperçu local
        run: |
          nohup npx astro preview --host 127.0.0.1 > /tmp/astro-preview.log 2>&1 &
          for essai in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Vérifier CLS, LCP et navigation mobile
        run: node scripts/controle-stabilite-mobile.mjs
        env:
          IC_VISUAL_BASE_URL: http://127.0.0.1:4321

      - name: Conserver le rapport du contrôle mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-stabilite-mobile
          path: controle-stabilite-mobile/rapport.json
          if-no-files-found: warn
          retention-days: 30

      - name: Conserver le rapport du maillage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-maillage-interne
          path: audit-maillage/
          if-no-files-found: warn
          retention-days: 30

      - name: Contrôler le texte destiné au public
        run: node scripts/controle-publication.mjs dist

      - name: Bloquer les doublons entre le journal et la presse en accueil
        run: node scripts/controle-doublons-accueil.mjs dist
        env:
          IC_ARTICLES: articles-prives/articles

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          retention-days: 1

  publier:
    needs: construire
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Vérifier les neuf articles sur le domaine public
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          base = 'https://www.intimeconviction.fr'
          slugs = [
              'chahinez-daoud-boutaa-perigueux-discernement',
              'paris-emilie-konig-proces-assises',
              'versailles-sadhana-verdict-assises',
              'romain-schlick-metz-verdict-appel-strasbourg',
              'charente-assises-romain-runel-ouverture-proces',
              'sarah-sadani-temoin-rescapee-fusillade-proces-aix',
              'karen-baldi-proces-chambery-protection-premeditation',
              'sarthe-assises-programme-decembre-2026',
              'coulommiers-melun-assises-intention-homicide',
          ]
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'IntimeConviction-PublicationCheck/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=12) as res:
                  return res.status, res.geturl(), res.headers.get('Content-Type',''), res.read()
          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ''
                  self.in_title = False
                  self.image = ''
                  self.canonical = ''
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'title': self.in_title = True
                  if tag == 'meta' and a.get('property') == 'og:image': self.image = a.get('content','')
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonical = a.get('href','')
              def handle_endtag(self, tag):
                  if tag == 'title': self.in_title = False
              def handle_data(self, data):
                  if self.in_title: self.title += data
          def norm(url):
              return urllib.parse.urlsplit(url).path.rstrip('/')
          def sitemap(url, visited):
              if url in visited: return set()
              visited.add(url)
              _, _, _, data = get(url)
              root = ET.fromstring(data)
              locs = [x.text.strip() for x in root.findall('.//{*}loc') if x.text]
              if root.tag.endswith('sitemapindex'):
                  found = set()
                  for loc in locs:
                      if urllib.parse.urlsplit(loc).hostname == urllib.parse.urlsplit(base).hostname:
                          found.update(sitemap(loc, visited))
                  return found
              return {norm(loc) for loc in locs}
          time.sleep(20)
          urls = set()
          sitemap_error = None
          for name in ('/sitemap-index.xml','/sitemap.xml'):
              try:
                  urls.update(sitemap(base+name, set()))
              except Exception as e:
                  sitemap_error = str(e)
          report = []
          for slug in slugs:
              url = base+'/'+slug+'/11/2026/'
              row = {'url':url,'sitemap':norm(url) in urls,'http':None,'title':None,'canonical_ok':False,'image_ok':False,'error':None}
              try:
                  status, final, typ, data = get(url)
                  row['http'] = status
                  p = Meta()
                  p.feed(data.decode('utf-8',errors='replace'))
                  row['title'] = p.title.strip()
                  row['canonical_ok'] = bool(p.canonical) and norm(p.canonical)==norm(url) and norm(final)==norm(url)
                  if p.image:
                      img = urllib.parse.urljoin(url,p.image)
                      row['image'] = img
                      if urllib.parse.urlsplit(img).hostname == urllib.parse.urlsplit(base).hostname:
                          code, _, content_type, _ = get(img)
                          row['image_ok'] = code==200 and content_type.startswith('image/')
              except Exception as e:
                  row['error'] = str(e)
                  row['http'] = getattr(e,'code',row['http'])
              row['ok'] = row['http']==200 and bool(row['title']) and row['canonical_ok'] and row['image_ok'] and row['sitemap']
              report.append(row)
          Path('controle-public').mkdir(exist_ok=True)
          Path('controle-public/rapport.json').write_text(json.dumps({'sitemap_entries':len(urls),'sitemap_error':None if urls else sitemap_error,'articles':report},ensure_ascii=False,indent=2))
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Contrôle public des neuf articles\n\n')
              f.write('| Article | HTTP | Canonical | Image | Sitemap | Résultat |\n|---|---|---|---|---|---|\n')
              for row in report:
                  f.write('| {} | {} | {} | {} | {} | {} |\n'.format(row['url'],row['http'],row['canonical_ok'],row['image_ok'],row['sitemap'],'OK' if row['ok'] else 'À vérifier'))
          if not all(row['ok'] for row in report): raise SystemExit(1)
          PY

      - name: Conserver le rapport de vérification publique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-public-neuf-articles
          path: controle-public/rapport.json
          if-no-files-found: warn
          retention-days: 7
