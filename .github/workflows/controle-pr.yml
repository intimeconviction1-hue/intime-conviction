# Tests ciblés sans accès au dépôt privé et sans publication de site.
name: Valider les correctifs éditoriaux

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'amelioration/**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe des attributions photographiques
        run: node --check src/lib/photos-articles.mjs
      - name: Vérifier les contrôles éditoriaux
        shell: bash
        run: |
          set -euo pipefail
          for fichier in tests/auditer-maillage.test.mjs tests/article-visible.test.mjs tests/auditer-production.test.mjs tests/verifier-seuils-maillage.test.mjs; do
            if [[ -f "$fichier" ]]; then
              node --test "$fichier"
            fi
          done

  graphe-complet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lire le fonds éditorial privé de la branche de chantier
        uses: actions/checkout@v4
        with:
          repository: intimeconviction1-hue/intime-conviction-articles
          ref: ${{ github.ref_name == 'main' && 'main' || 'amelioration/chantier-11-bis-diagnostics' }}
          ssh-key: ${{ secrets.ARTICLES_DEPLOY_KEY }}
          path: articles-prives
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tester le dépôt
        run: npm test
      - name: Préparer les illustrations du fonds
        run: node scripts/preparer-illustrations.mjs
        env:
          IC_ARTICLES: articles-prives/articles
      - name: Construire le site complet sans publication ni collecte externe
        run: npx astro build
        env:
          IC_ARTICLES: articles-prives/articles
          IC_VEILLE: articles-prives/veille-alertes.json
          IC_VEILLE_AJOUTS: articles-prives/veille-alertes-ajouts.json
      - name: Installer Chromium pour les mesures mobiles
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Démarrer l’aperçu local
        run: |
          nohup npx astro preview --host 127.0.0.1 > /tmp/astro-preview.log 2>&1 &
          for essai in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1
      - name: Mesurer la stabilité mobile des quatre pages prioritaires
        run: node scripts/controle-stabilite-mobile.mjs
        env:
          IC_VISUAL_BASE_URL: http://127.0.0.1:4321
      - name: Conserver le rapport mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controle-stabilite-mobile
          path: controle-stabilite-mobile/rapport.json
          if-no-files-found: warn
          retention-days: 30
      - name: Auditer le graphe complet
        run: node scripts/auditer-maillage.mjs dist
        env:
          IC_AUDIT_MAILLAGE_OUTPUT: audit-maillage/rapport.json
      - name: Refuser les anomalies non justifiées
        run: node scripts/verifier-seuils-maillage.mjs audit-maillage/rapport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-maillage-complet
          path: audit-maillage/rapport.json
          if-no-files-found: error
          retention-days: 30
