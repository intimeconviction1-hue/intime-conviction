# Revue éditoriale planifiée des rôles officiels.
# Les pages des cours d'appel opposent une page HTML sans documents aux requêtes
# GitHub Actions (constaté 2026-11-07). Ne prétend donc PAS détecter les PDF.
# Le travail humain est tracé en issue GitHub, sans publication automatique.
name: Revue éditoriale des rôles

on:
  schedule:
    # Chaque lundi, sans répétition si une issue de vérification reste ouverte.
    - cron: "25 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/surveiller-roles.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: revue-editoriale-roles
  cancel-in-progress: false

jobs:
  revue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Préparer un contrôle humain sans lire les documents protégés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Revue des rôles d’assises : vérifier les sources officielles"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Une revue éditoriale est déjà ouverte : pas de doublon." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {ROLES_OFFICIELS} from './src/lib/roles-officiels.mjs';
          const source=new Map();
          for(const r of ROLES_OFFICIELS){
            if(r.mode==='sur-place'||r.mode==='information')continue;
            const prev=source.get(r.url)??{url:r.url,codes:[],description:r.titre};
            if(!prev.codes.includes(r.code))prev.codes.push(r.code);
            source.set(r.url,prev);
          }
          const now=new Date().toISOString().slice(0,10);
          const lines=[
            '# Vérification éditoriale des rôles de cours d’assises',
            '',
            'Date de création : '+now+'. Action requise : consulter directement les sites officiels ci-dessous.',
            '',
            '> **Important** : la collecte automatique des PDF sur ces pages est indisponible depuis GitHub Actions. Ce ticket est un contrôle **humain**, pas une alerte de changement détecté.',
            '',
            '## Contrôles à effectuer',
            '',
            '- [ ] Pour chaque source, relever la date de mise à jour de la page et les nouveaux rôles ou rôles modificatifs.',
            '- [ ] Comparer les documents avec la dernière revue, lorsque des éléments vérifiés sont conservés.',
            '- [ ] Confirmer auprès de la juridiction tout report, déplacement ou changement sensible.',
            '- [ ] Vérifier les informations légales et le caractère public des données avant rédaction.',
            '- [ ] N’ajouter aux dossiers d’Intime Conviction que les faits recoupés et sourcés.',
            '',
            '## Pages officielles à consulter',
            '',
          ];
          for(const r of [...source.values()].sort((a,b)=>a.codes.join().localeCompare(b.codes.join()))) {
            lines.push('- **'+r.codes.join(', ')+'** : '+r.description+'  '+r.url);
          }
          lines.push('','Les rôles accessibles seulement sur place, notamment Rouen, ne sont pas collectés automatiquement. Ce ticket peut être fermé une fois les vérifications consignées. La prochaine revue ne sera créée que si aucun ticket du même titre n’est ouvert.');
          writeFileSync('role-revue.md',lines.join('\n')+'\n');
          JS
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file role-revue.md
          echo "Une revue officielle est à vérifier manuellement. Aucun rôle n’a été publié automatiquement." >> "$GITHUB_STEP_SUMMARY"
